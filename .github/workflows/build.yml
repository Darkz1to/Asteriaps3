name: Build Asteria PS3

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extrair o ZIP do projeto
        run: |
          ZIP=$(find . -maxdepth 2 -iname '*.zip' -not -path './.git/*' | head -n1)
          if [ -z "$ZIP" ]; then echo "Nenhum .zip encontrado no repositorio"; exit 1; fi
          echo "Usando: $ZIP"
          mkdir -p work
          unzip -q -o "$ZIP" -d work
          MK=$(find work -name Makefile -not -path '*/pkg/*' | head -n1)
          if [ -z "$MK" ]; then echo "Makefile nao encontrado dentro do zip"; exit 1; fi
          echo "PROJ=$(dirname "$MK")" >> "$GITHUB_ENV"

      - name: Compilar PKG (Docker ps3dev-sdl2)
        run: |
          docker run --rm -v "$PWD/$PROJ:/build" -w /build --entrypoint bash \
            hldtux/ps3dev-sdl2 -c "make pkg"

      - name: Enviar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: Asteria-PS3
          path: |
            ${{ env.PROJ }}/*.pkg
            ${{ env.PROJ }}/*.elf
